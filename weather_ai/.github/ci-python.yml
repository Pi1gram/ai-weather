name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python --version
          pip install --upgrade pip
          echo "Installing requirements..."
          pip install --upgrade -r requirements.txt
          pip --version
          echo "Installed packages:"
          pip list --local

      - name: Check formatting
        run: ruff format --check .

      - name: Check requirements sorting
        run: sort-requirements --check requirements.txt

      - name: Run linter
        run: |
          mkdir -p public
          ruff check . --output-format github --output-file public/ruff-report.json || true

      # Add your test command here if you have tests, e.g.:
      # - name: Run tests
      #   run: pytest